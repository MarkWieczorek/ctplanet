name: Upload Python Package to PYPI

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  deploy:
    runs-on: codeberg-medium

    permissions:
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Miniconda
      uses: https://github.com/conda-incubator/setup-miniconda@v4
      with:
        python-version: 3.14
        channels: conda-forge
        auto-update-conda: true
        miniconda-version: "latest"
        activate-environment: pypi

    - name: Set up Conda environment and build package
      shell: bash -l {0}
      run: |
        conda config --set always_yes yes --set changeps1 no
        conda install -q -n pypi setuptools pypandoc
        pip install build
        python -m build .

    - name: Publish
      if: forgejo.event.action == 'published'
      uses: https://github.com/pypa/gh-action-pypi-publish@release/v1
      with:
        username: __token__
        password: ${{ secrets.ctplanet_pypi }}
